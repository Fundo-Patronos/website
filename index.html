    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é o Fundo Patronos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Fundo Patronos é o fundo patrimonial (endowment) da Unicamp - Universidade Estadual de Campinas. É uma organização sem fins lucrativos que investe doações para gerar rendimentos perpétuos, apoiando estudantes com bolsas de estudo, mentoria de carreira e projetos extracurriculares. Com mais de 400 doadores e R$ 3 milhões em patrimônio, o Patronos garante apoio sustentável e de longo prazo aos estudantes da Unicamp."
          }
        },
        {
          "@type": "Question",
          "name": "O que é um Fundo Patrimonial ou Endowment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Um fundo patrimonial, ou endowment, é uma reserva financeira criada por organizações sem fins lucrativos para garantir sua sustentabilidade. O dinheiro vem de doações e é investido para gerar rendimentos. Parte desses rendimentos é usada nas atividades da organização, enquanto o restante é reinvestido para manter o Fundo crescendo. Assim, mesmo sem novas doações, a organização continua tendo recursos de forma perpétua. As maiores universidades do mundo, como Harvard e Yale, utilizam este modelo."
          }
        },
        {
          "@type": "Question",
          "name": "Como doar para a Unicamp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Você pode doar para a Unicamp através do Fundo Patronos, o endowment oficial da universidade. Acesse doa.re/patronos para fazer uma doação única ou recorrente. Também é possível doar via PIX para operacoes@patronos.org. Empresas podem contribuir através de parcerias estratégicas. Todas as doações são investidas para gerar impacto perpétuo na comunidade acadêmica da Unicamp."
          }
        },
        {
          "@type": "Question",
          "name": "Quais programas o Fundo Patronos oferece?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Fundo Patronos oferece quatro programas principais: 1) Centro de Carreiras - plataforma 24/7 de mentoria com profissionais do mercado; 2) Trilha de Carreiras - programa de 5 meses de mentoria para transição ao mercado de trabalho; 3) Decola Extras - apoio financeiro de até R$ 7.500 para projetos extracurriculares; 4) Talentos e Bolsas - bolsa mensal, laptop e curso de inglês para estudantes em vulnerabilidade."
          }
        },
        {
          "@type": "Question",
          "name": "As doações para o Fundo Patronos oferecem incentivos fiscais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atualmente, devido à legislação brasileira, não podemos oferecer incentivos fiscais para doadores do Fundo Patronos. No entanto, estamos trabalhando ativamente com outros fundos patrimoniais e representantes no Congresso Nacional para alterar essa legislação e oferecer esse benefício no futuro."
          }
        },
        {
          "@type": "Question",
          "name": "Quem pode usar o Centro de Carreiras da Unicamp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Centro de Carreiras é exclusivo para estudantes de graduação e pós-graduação da Unicamp de todos os cursos e áreas. Para acessar a plataforma em carreiras.patronos.org, é necessário se registrar com o email da DAC para validação automática. A plataforma está disponível 24/7/365 com mentores de todas as áreas e indústrias."
          }
        }
      ]
    }
    </script>
