    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O que é um Fundo Patrimonial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Um fundo patrimonial, ou endowment, é uma reserva financeira criada por organizações sem fins lucrativos para garantir sua sustentabilidade. O dinheiro vem de doações e é investido para gerar rendimentos. Parte desses rendimentos é usada nas atividades da organização, enquanto o restante é reinvestido para manter o Fundo crescendo. Assim, mesmo sem novas doações, a organização continua tendo recursos de forma perpétua."
          }
        },
        {
          "@type": "Question",
          "name": "Como o Fundo Patronos opera e acelera a missão acadêmica da Unicamp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Fundo Patronos acelera a missão acadêmica da Unicamp através de um modelo sustentável de investimentos. Nosso capital é investido profissionalmente para gerar rendimentos ao longo do tempo. Com esses rendimentos, atuamos em três frentes principais: Inovação, Tecnologia e Pesquisa; Carreira; e Acesso (bolsas de estudo, laptops e cursos de inglês para alunos em vulnerabilidade social)."
          }
        },
        {
          "@type": "Question",
          "name": "Como posso apoiar o Fundo Patronos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Qualquer pessoa ou empresa pode apoiar nossa causa. Para pessoas físicas, a doação pode ser feita de duas maneiras: um valor determinado ou através de doações recorrentes através do site doa.re/patronos. Empresas também podem contribuir através de parcerias estratégicas. Todas as doações são direcionadas para fortalecer nosso patrimônio e ampliar nosso impacto na comunidade acadêmica."
          }
        },
        {
          "@type": "Question",
          "name": "As doações para o Fundo Patronos oferecem incentivos fiscais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Atualmente, devido à legislação brasileira, não podemos oferecer incentivos fiscais para doadores do Fundo Patronos. No entanto, estamos trabalhando ativamente com outros fundos patrimoniais e representantes no Congresso Nacional para alterar essa legislação e oferecer esse benefício no futuro."
          }
        },
        {
          "@type": "Question",
          "name": "As pessoas que trabalham no Fundo Patronos são remuneradas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Todas as pessoas que trabalham no Fundo Patronos são voluntárias e não recebem remuneração. Trabalhamos no Fundo porque nos sentimos alinhados com a missão e o propósito da organização, dedicando nosso tempo e expertise para fortalecer a educação superior no Brasil e apoiar a comunidade acadêmica da Unicamp."
          }
        },
        {
          "@type": "Question",
          "name": "Quem pode utilizar o Centro de Carreiras?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O Centro de Carreiras é exclusivo para estudantes de graduação e pós-graduação da Unicamp de todos os cursos e áreas. Para acessar a plataforma, é necessário se registrar preferencialmente com o email da DAC para validação automática. A plataforma está disponível 24/7/365."
          }
        }
      ]
    }
    </script>
